<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>frame</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>html,body{margin:0;background:#07080a}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/data.js"></script>
<script src="../js/engine.js"></script>
<script>
// Отладочный кадр 4K: ?day=2025-08-07&style=segments|smooth|pixel&grid=12&span=420&only=1&focus=<id>&heights=equal
(async function () {
  const q = new URLSearchParams(location.search);
  await Promise.all(['400', '500', '600', '700'].map((w) => document.fonts.load(w + ' 40px Onest'))
    .concat(['400', '500', '600'].map((w) => document.fonts.load(w + ' 30px "JetBrains Mono"'))));
  const T = window.Tablo;
  const tl = new T.Timeline(window.TABLO_DATA);
  const sim = new T.Sim(tl);
  const rnd = new T.Renderer(tl);
  const c = document.getElementById('c');
  c.width = 3840; c.height = 2160;
  const ctx = c.getContext('2d');
  const enabled = {};
  const only = q.get('only') === '1';
  for (const co of tl.companies) enabled[co.id] = only ? !!co.main : true;
  const hidden = Object.fromEntries(tl.releases.filter((r) => r.defaultHidden).map((r) => [r.id, true]));
  const target = T.dayOf(q.get('day') || '2025-08-10');
  const ctl = { now: tl.start, span: +(q.get('span') || 420), cam: 'follow', enabled, hidden, labels: true, scale: true, frontier: true,
    heights: q.get('heights') || 'score', others: q.get('others') || 'muted', focus: q.get('focus') || null,
    style: q.get('style') || 'segments', grid: +(q.get('grid') || 12), labelCount: 12, snap: true };
  for (let d = tl.start; d <= target; d += 2) { ctl.now = d; sim.step(0.05, ctl); }
  ctl.now = target;
  for (let i = 0; i < 60; i++) sim.step(0.05, ctl);
  for (let i = 0; i < 24; i++) { sim.step(0.05, ctl); rnd.draw(ctx, sim, ctl, c.width, c.height); }
  const t0 = performance.now();
  for (let i = 0; i < 5; i++) { sim.step(0.04, ctl); rnd.draw(ctx, sim, ctl, c.width, c.height); }
  window.__drawMs = (performance.now() - t0) / 5;
  window.__ready = true;
})();
</script>
</body></html>
